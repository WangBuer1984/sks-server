server:
  port: 8080


spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sks}
    username: ${SPRING_DATASOURCE_USERNAME:sks}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  # 语音回答 multipart（Task 2.2）：与 Python /ai/asr 的 60s / 60MB 上限对齐，
  # 避免 Java 先于 Python 返回 413（压缩 webm 通常远小于此，wav 60s 也覆盖）。
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 64MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 邮件告警通道（MailAlertNotifier）：host 空 → Spring Boot MailSender 自动配置不生效 →
  # 无 JavaMailSender bean → MailAlertNotifier stub（log + no-op，不抛）。详见 spec §3.4。
  # 465 = SMTPS，必须显式开 ssl.enable=true（默认明文会挂起/隐晦失败）；若改 587 用 starttls.enable 并去掉 ssl.enable。
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.enable: true
  profiles:
    # 默认 local（本地联调）。生产由 compose 注入 SPRING_PROFILES_ACTIVE=prod 覆盖——
    # env 优先级高于 application.yml。本地 IDEA 跑无需在 Run Config 设 profile：默认即 local，
    # 自动加载 application-local.yml + 经其 spring.config.import 引入 .env。
    active: ${SPRING_PROFILES_ACTIVE:local}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.sks: INFO
    org.springframework.security: INFO

sks:
  trial-credit: ${TRIAL_CREDIT:3}
  # Java→Python 内网调用（AiClient 基座用）：base-url 在 docker 内是 http://sks-ai:8000，
  # 本地 dev 可用 http://localhost:8000；service-token 来自 .env SERVICE_TOKEN（Python verify_service_token 校验同值）。
  ai:
    base-url: ${SKS_AI_BASE_URL:http://sks-ai:8000}
    # §5.3 全链路超时「内层短于外层」：Python LLM 单 120s × 最多 2 = 240s
    # → Java read-timeout 270s → nginx 300s。内层不可长于外层，否则外层先掐断仍在跑的调用。
    connect-timeout-seconds: ${SKS_AI_CONNECT_TIMEOUT:10}
    read-timeout-seconds: ${SKS_AI_READ_TIMEOUT:270}
  service-token: ${SERVICE_TOKEN:}
  # 复盘双阈值带状区间（§4.4）：play >= avg×hot-threshold → hot；play < avg×flop-threshold → flop；之间 → plain。
  # ReviewService 读后传入纯函数 ReviewStateMachine.classify（不在此读，保持纯函数可单测）。
  review:
    hot-threshold: ${SKS_REVIEW_HOT_THRESHOLD:3.0}
    flop-threshold: ${SKS_REVIEW_FLOP_THRESHOLD:0.5}
  # 余额监控（P5 Task 5.1 QuotaWatchJob）——阈值严格 <（at-threshold 不告警）。
  # 余额查询 API 为联调项（留桩）；告警走邮件（sks.alert.admin-email / MailAlertNotifier）。
  quota:
    sms-threshold: ${SKS_QUOTA_SMS_THRESHOLD:100}
    glm-threshold: ${SKS_QUOTA_GLM_THRESHOLD:20}
  # 阿里云 DYPNS 短信认证（spec §3.3——AliyunSmsAuthClient 条件降级：key/template 空→stub 不抛；
  # 齐全→真 SendSmsVerifyCode 字面码模式，失败抛 SMS_SEND_FAILED 5003）。env 来自 .env（gitignored）。
  # sks-server 用 env_file:.env，所有 ALIYUN_* 已自动进容器，无需改 docker-compose.yml。
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}    # DYPNS（非 dysmsapi）
    # 签名写死在这里（YAML，Spring 按 UTF-8 读），且**故意不留 ${ALIYUN_SMS_SIGN} 占位符**——
    # 它是全项目唯一的非 ASCII 配置项，而经 .env / 环境变量传非 ASCII 这条路是坏的：
    #   本地：spring.config.import 的 [.properties] 走 Java properties 加载器 = ISO-8859-1，
    #        「恒创联众」的 12 个 UTF-8 字节被读成 12 个字符，SDK 再按 UTF-8 编码发出（二次编码）→
    #        阿里云回 isv.INVALID_PARAMETERS「签名或者模版无效」，报错完全不提编码（已实测）。
    #   容器：经 env_file 进环境变量后由 sun.jnu.encoding 解码，该值跟随 locale 而 temurin 未设 LANG。
    # 签名不是密钥（每条短信都印着它），入 git 无妨。要换签名改这一行即可。
    # 注意 Spring 松散绑定下 SKS_SMS_SIGN_NAME 环境变量仍能覆盖本项，那条路同样有编码风险——
    # AliyunSmsAuthClient.warnIfMangled 会在乱码时直接报出修法。
    sign-name: 恒创联众
    template-login: ${ALIYUN_SMS_TEMPLATE_LOGIN:}              # 登录/注册赠送模板（如 100002）
    template-verify-old: ${ALIYUN_SMS_TEMPLATE_VERIFY_OLD:}   # 换绑验旧号赠送模板
    template-bind-new: ${ALIYUN_SMS_TEMPLATE_BIND_NEW:}      # 换绑验新号赠送模板
  # 邮件告警收件人（MailAlertNotifier）。空 → stub 不发；非空 + spring.mail.host 非空 → 真发邮件。
  # 值来自 .env SKS_ALERT_ADMIN_EMAIL（站长邮箱）。
  alert:
    admin-email: ${SKS_ALERT_ADMIN_EMAIL:}
